physical-attack:
  names: ["物理伤害", "攻击力"]
  reader: default
  handler: 'attribute/fight/attack'
  priority: 100
  triggers: attack
  options:
    # attacker 是攻击方的消息提示
    attacker: '你对 {entity} 共造成了 {total} 点伤害.'
    # entity 是受击方的消息提示
    entity: '{attacker} 对你造成了 {total} 点伤害.'

pvp-attack:
  names: ["PVP伤害"]
  reader: default
  handler: 'attribute/fight/pvp-attack'
  priority: 110
  triggers: attack

pve-attack:
  names: ["PVE伤害"]
  reader: default
  handler: 'attribute/fight/pve-attack'
  priority: 120
  triggers: attack

real-attack:
  names: ["真实伤害"]
  reader: default
  # 真伤没有什么特殊逻辑 可以复用物理伤害的脚本实现
  # 如果要单独改物理伤害或真伤的逻辑 那就得拆成两个脚本了
  handler: 'attribute/fight/attack'
  priority: 340
  triggers: attack
  options:
    attacker: '你对 {entity} 造成了 {damage} 点真实伤害.'
    entity: '{attacker} 对你造成了 {damage} 点真实伤害.'

physical-defense:
  names: [ "物理防御", "防御力" ]
  reader: default
  handler: 'attribute/fight/defense'
  priority: 200
  triggers: defense

pvp-defense:
  names: ["PVP防御"]
  reader: default
  handler: 'attribute/fight/pvp-defense'
  priority: 210
  triggers: defense

pve-defense:
  names: ["PVE防御"]
  reader: default
  handler: 'attribute/fight/pve-defense'
  priority: 220
  triggers: defense
