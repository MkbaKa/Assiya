vampire:
  names: ["吸血几率"]
  reader: percent
  handler: 'attribute/fight/vampire'
  priority: 160
  triggers: attack
  # 自定义选项
  options:
    # 若为 true 则吸血时会增加对应的伤害
    extra-damage: false
    attacker: '吸血! 本次吸血量 {heal} 点生命力!'
    entity: '吸血! {attacker} 触发了 {heal} 点吸血!'

vampire-rate:
  names: ["吸血倍率"]
  reader: default

vampire-resist:
  names: ["吸血抵抗"]
  reader: default

vampire-dodge:
  names: ["吸血闪避"]
  reader: default
