# 其他节点的作用看
# attribute/fight/attack.yml
max-health:
  names: ["生命上限", "生命力"]
  reader: default
  handler: 'attribute/health'
  priority: 100
  # 当 trigger 触发时, 大概流程是这样的:
  # 触发事件 -> 判断属性值 -> 执行逻辑
  #   判断属性值会过滤掉触发者没有的属性 不让它触发
  #   该选项负责跳过这一过程 使得属性无论如何都会触发
  #   通常用于 加成类 属性清理上次加成结果
  #   以及把值的判断拖到 handler 执行里 若没有属性值则不执行后续加成逻辑
  # 如果 加成类 不开启这个选项会怎么样?
  #   举例: 玩家有一个带有 生命上限100 的物品 并把它拿在了手上
  #      handler 会正常增加 100 点血量给玩家  这是正常逻辑
  #      差异点在于 当玩家手上切换到另外一个没有 生命上限100 的物品时
  #      没有开启选项的属性 不会执行 handler   也就是不会把已增加的 100 点血量扣掉
  #      开启该选项才能把已增加的血量扣掉
  always-run: true
  triggers: update

moving:
  names: ["移动速度"]
  reader: default
  handler: 'attribute/moving'
  priority: 110
  always-run: true
  triggers: update

reflection:
  names: ["反弹几率"]
  reader: default
  handler: 'attribute/fight/reflection'
  priority: 310
  triggers: defense
  options:
    attacker: '{entity} 反弹了 {reflection} 点伤害.'
    entity: '你反弹了 {reflection} 点伤害.'

reflection-rate:
  names: ["反弹倍率"]
  reader: default

fire:
  names: ["燃烧几率"]
  reader: default
  handler: 'attribute/fight/fire'
  priority: 320
  triggers: attack
  options:
    attacker: '燃烧! 额外造成 {extra} 点燃烧伤害!'
    entity: '燃烧! 对方对你额外造成 {extra} 点燃烧伤害!'

fire-damage:
  names: ["燃烧伤害"]
  reader: default

# 在基础 3 秒上增加的时间, 单位为秒
fire-time:
  names: ["燃烧时间"]
  reader: default

frozen:
  names: ["冰冻几率"]
  reader: default
  handler: 'attribute/fight/frozen'
  priority: 330
  triggers: attack
  options:
    attacker: '你降低了对方 {frozen}% 移动速度, 持续 {duration} 秒!'
    entity: '对方降低了你 {frozen}% 移动速度, 持续 {duration} 秒!'

frozen-intensity:
  names: ["冰冻强度"]
  reader: default

# 在基础 3 秒上增加的时间, 单位为秒
frozen-time:
  names: ["冰冻时间"]
  reader: default

remote-immune:
  names: ["远程免疫"]
  reader: default
  handler: 'attribute/fight/remote-immune'
  priority: 10
  triggers: defense
  options:
    attacker: '{entity} 免疫了你的远程伤害.'
    entity: '你免疫了 {attacker} 的远程伤害.'
