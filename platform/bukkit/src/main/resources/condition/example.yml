# 索引名
level-require:
  # 识别名
  names: ["等级需求", "Lv."]
  # 读取规则
  reader: default
  # 实现逻辑的脚本位置
  # 具体信息见 attribute/fight/attack.yml
  handler: 'condition/level-require'

# "权限需求: xxx"
# 多个权限可以用 / 分隔  满足任意一个就通过
# 像 "权限需求: 战士/法师/弓箭手"
# 后面的内容会被作为权限节点判断
permission:
  names: ["权限需求", "职业"]
  reader: text
  handler: 'condition/permission'

# 多个槽位用 / 分隔  满足任意一个即可
# "装备槽位: 头盔/鞋子"
# 双持表示主手或副手.
equipment-slot:
  names: ["装备槽位", "装备类型"]
  reader: text
  handler: 'condition/equipment-slot'
  options:
    MAIN_HAND: ['主手', '双持']
    OFF_HAND: ['副手', '双持']
    HEAD: ['头盔']
    CHEST: ['衣服']
    LEGS: ['裤子']
    FEET: ['鞋子']
