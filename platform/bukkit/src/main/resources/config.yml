settings:
  # 每次进入战斗后自动脱战的时长 (秒)
  combat-duration: 10
  # 是否将原版攻击伤害加入属性伤害计算
  vanilla-damage: true
  # 是否启用血量压缩
  health-scale: true
  # 当启用血量压缩时 压缩到多少血
  health-scale-value: 40
  # 是否启用 assiya 默认的数据管理
  # 玩家进入服务器时创建 退出时清理
  # 关闭后需要附属做数据加载
  # 比如改成从数据库创建/保存
  player-session-lifecycle: true
  # 当上面的 lifecycle 为 true 时
  # 玩家离线后多长时间清理缓存 (秒)
  # 若为 0 则直接删除
  # 用来做非持久化数据的掉线保护
  # 比如玩家获得了一个持续 5 秒的临时属性源
  # 如果离线直接删除 那重连进服务器属性就消失了
  # 稍微给一点重连空间可以让临时属性保留
  # 如果离线保存到数据库显然不需要考虑这个问题
  player-session-timeout: 600
  # 定时属性的全局计数上限 (tick)
  # 必须是所有 timer 触发器 period 的公倍数
  # 例如两个属性的 period 为 20 和 30 上限可以填 60 或 1200
  timer-reset-period: 1200

equipment:
  # 装备变化后的属性读取延迟 (tick)
  # 频繁变化只有最后一次会读取
  refresh-delay-ticks: 8
  # 玩家装备属性的优先级
  # 修改后重新读取生效
  source-priority: 100

parser:
  cache:
    # 解析文本属性的缓存容量
    maximum-size: 10000
    # 缓存过期时间 (秒)
    expire-after-access-seconds: 600

mythicmobs:
  # 怪物属性的优先级
  # 重载后要重新生成怪物生效
  source-priority: 100

async:
  # 异步线程池的容量 不知道是啥就不要动
  # 0 默认为 cpu 逻辑处理器数量的一半
  # 重启生效
  threads: 0

formats:
  # 罗马数字字符对应的数值
  roman:
    I: 1
    V: 5
    X: 10
    L: 50
    C: 100
    D: 500
    M: 1000

# 默认拥有的属性
# 删掉对应的 player 或者 entity 代表不给
default-attributes:
  # 优先级
  priority: 80
  # 玩家
  player:
    - '生命上限 100'
  # 非玩家实体
  # mm 怪会同时获得这些和他配置里的 attributes
#  entity:
#    - '生命上限 20'
