# 百分比属性用的读取组
# 这个 % 只用来展示 不像 default 一样作为百分比加成
percent:
  captures:
    value: add
    valueAddition: add
    min: add
    max: add
  patterns:
    # 范围数值 "暴击几率: 10-20" / "10-20%"
    - '{name}[\s:：]*<min>\s*-\s*<max>\s*%?'
    # 数值 + 括号追加 "暴击几率: 50 (+10)" / "50 (+10)%"
    - '{name}[\s:：]*<value>\s*\(\s*\+?\s*<valueAddition>\s*\)\s*%?'
    # 百分比数值 "暴击几率: 25%"
    - '{name}[\s:：]*<value>\s*%'
    # 普通数值 "暴击几率: 25"
    - '{name}[\s:：]*<value>'
    # 前置值
    # 范围数值 "10-20 暴击几率" / "10-20% 暴击几率"
    - '<min>\s*-\s*<max>\s*%?\s*{name}'
    # 数值 + 括号追加 "50 (+10) 暴击几率" / "50 (+10)% 暴击几率"
    - '<value>\s*\(\s*\+?\s*<valueAddition>\s*\)\s*%?\s*{name}'
    # 百分比数值 "25% 暴击几率"
    - '<value>\s*%\s*{name}'
    # 普通数值 "25 暴击几率"
    - '<value>\s*{name}'
  placeholders:
    random: 'random(<min>, <max>)'
    valueRandom: '<value> + <valueAddition> + <random>'
    total: '<valueRandom>'
